version: "3.8"

services:
  gmail-mcp-server:
    build: .
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      # HTTP transport so the container exposes a port to health-check.
      GMAIL_MCP_MCP_TRANSPORT: http
      GMAIL_MCP_MCP_HOST: 0.0.0.0
      GMAIL_MCP_MCP_PORT: "8080"
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; s = socket.socket(); s.connect(('localhost', 8080)); s.close()"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  postgres:
    image: postgres:15-slim
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: gmail_mcp
      POSTGRES_USER: gmail_mcp
      POSTGRES_PASSWORD: gmail_mcp_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gmail_mcp"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
