[project]
name = "gmail-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server exposing Gmail operations for AI agents"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Gmail MCP Server Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp",
    "google-api-python-client",
    "google-auth-oauthlib",
    "pydantic",
    "pydantic-settings",
    "sqlalchemy",
    "alembic",
    "httpx",
    "cryptography",
    "python-dotenv",
]

[project.optional-dependencies]
postgresql = [
    "psycopg2-binary",
    "pgvector",
]
search = [
    # sqlite-vec is the maintained successor to sqlite-vss and ships prebuilt
    # wheels; it implements the same default vector-backend capability.
    "sqlite-vec",
    "sentence-transformers",
]
notifications = [
    "redis",
]
llm = [
    "llama-cpp-python",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
    "setuptools>=83.0.0",
    "fakeredis",
    "respx",
    "pytest-httpserver",
]

[project.urls]
Homepage = "https://github.com/CoolDevGuys/agentic-mail-mcp"
Repository = "https://github.com/CoolDevGuys/agentic-mail-mcp"
Documentation = "https://github.com/CoolDevGuys/agentic-mail-mcp/tree/main/specs/docs"
Changelog = "https://github.com/CoolDevGuys/agentic-mail-mcp/blob/main/CHANGELOG.md"

[project.scripts]
gmail-mcp-server = "src.Bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.hatch.build.targets.sdist]
# Ship only the package and what's needed to build/run it — keep editor,
# tooling, and node_modules noise out of the release artifact.
only-include = [
    "src",
    "migrations",
    "specs/docs",
    "README.md",
    "LICENSE",
    "CHANGELOG.md",
    "pyproject.toml",
    "alembic.ini",
    ".env.example",
]
exclude = [
    "**/__pycache__",
    "**/*.pyc",
]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

omit = [
    "src/Notification/Domain/Gateway/*",
    # Native/optional adapters that require a SQLite build with extension
    # loading, PostgreSQL, or model weights — exercised via guarded integration
    # tests when those backends are available, skipped in the default suite.
    "src/Search/Infrastructure/SqliteVec/*",
    "src/Search/Infrastructure/PgVector/*",
    "src/Gmail/Infrastructure/Persistence/PostgreSQL/*",
]

[tool.coverage.paths]
source = ["src"]

[tool.ruff]
lint.ignore = ["N999"]

[tool.mypy]
ignore_missing_imports = true
