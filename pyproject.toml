[project]
name = "gmail-mcp-server"
version = "0.1.0"
description = "A Model Context Protocol (MCP) server exposing Gmail operations for AI agents"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Gmail MCP Server Team" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "mcp",
    "google-api-python-client",
    "google-auth-oauthlib",
    "pydantic",
    "pydantic-settings",
    "aiosqlite",
    "sqlalchemy",
    "alembic",
    "httpx",
    "python-dotenv",
]

[project.optional-dependencies]
postgresql = [
    "asyncpg",
    "psycopg2",
]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-cov",
    "ruff",
    "mypy",
]

[project.scripts]
gmail-mcp-server = "src.Bootstrap.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING",
    "raise NotImplementedError",
]

[tool.coverage.paths]
source = ["src"]

[tool.ruff]
lint.ignore = ["N999"]

[tool.mypy]
ignore_missing_imports = true
