[pytest]
asyncio_mode = auto
testpaths = tests
markers =
    unit: Unit tests
    integration: Integration tests
    e2e: End-to-end tests (full MCP session; container tests are opt-in)
    uses_real_env: Test reads the developer's real .env (opt-in live tests)
addopts = --cov=src --cov-fail-under=90 --cov-config=pyproject.toml
